name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gjs and gnome-shell tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gjs gnome-shell-common zip
      - name: Lint
        run: make lint
      - name: Unit tests
        run: |
          set -e
          fail=0
          for t in selftest nettest histtest drawtest tigertest claudetest usagetest; do
            out=$(gjs -m src/$t.js 2>&1) || true
            if echo "$out" | grep -q "ALL TESTS PASSED"; then
              echo "$out" | tail -1
            else
              echo "::group::$t FAILED - full output"
              echo "$out"
              echo "::endgroup::"
              echo "::error::$t failed"
              echo "$out" | grep -E "FAIL" || true
              fail=1
            fi
          done
          exit $fail

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gjs gnome-shell-common zip
      - run: make pack
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.shell-extension.zip
          generate_release_notes: true
